<head>
    <title>Admission</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Admission Form</h1>
    <p>Apply for Admission</p>
</header>

<nav>
    <a href="index.html">Home</a>

<main>
    <section>
        <h2>Student Admission Form</h2>

        <form action="https://script.google.com/macros/s/AKfycbzzoVfvyK1He02PdlBf9Zc6E-eqKaDet9F8n440IKpHJ7JH7YvBOTZeMDjyQd1R5eHixg/exec" method="POST" target="hiddenFrame" onsubmit="alert('Application Submitted Successfully!');">

<label>Student Name</label>
<input type="text" name="studentName" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Mobile Number</label>
<input type="tel" name="mobile" required>

<label>Date of Birth</label>
<input type="date" name="dob" required>

<label>Gender</label>
<select name="gender" required>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Course</label>
<select name="course" required>
<option>Select Course</option>
<option>B.Tech CSE</option>
<option>B.Tech ECE</option>
<option>B.Tech EEE</option>
<option>B.Tech Civil Engineering</option>
<option>B.Tech Mechanical Engineering</option>
<option>B.Tech AI & ML</option>
<option>B.Tech AI & DS</option>
<option>B.Tech EC</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
<option>MBA</option>
</select>

<label>Hobbies</label>
<input type="text" name="hobbies">

<label>Address</label>
<textarea name="address"></textarea>

<label>Upload Photo</label>
<input type="file">

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

<iframe name="hiddenFrame" style="display:none;"></iframe>
    </section>
</main>

<footer>

</footer>

</body>
</html>
